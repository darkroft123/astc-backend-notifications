# =============================================================================
# ASTC CN Notification Email — Configuration
# Todas las propiedades son configurables mediante variables de entorno.
# =============================================================================

quarkus.application.name=astc-cn-notification-email
quarkus.http.port=${QUARKUS_HTTP_PORT:8086}

# =============================================================================
# DATABASE (solo lectura del schema notification para plantillas y layouts)
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:notifications_user}
quarkus.datasource.password=${DB_PASSWORD:notifications_password}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:app}}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:10}
quarkus.datasource.jdbc.acquisition-timeout=${DB_ACQUISITION_TIMEOUT:60s}

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.default-schema=notification
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.database.version=16
quarkus.hibernate-orm.jdbc.statement-batch-size=50

# =============================================================================
# RABBITMQ — Consumer (Incoming)
# =============================================================================
quarkus.rabbitmq.devservices.enabled=false

mp.messaging.incoming.email-notification-in.connector=smallrye-rabbitmq
mp.messaging.incoming.email-notification-in.queue.name=${RABBITMQ_QUEUE_NAME:email-notification.queue}
mp.messaging.incoming.email-notification-in.exchange.name=${RABBITMQ_EXCHANGE_NAME:email.notification}
mp.messaging.incoming.email-notification-in.exchange.type=direct
mp.messaging.incoming.email-notification-in.routing-keys=${RABBITMQ_ROUTING_KEY:email.notification}
mp.messaging.incoming.email-notification-in.queue.durable=true
# dead-letter-exchange para que los mensajes NACK'd vayan al DLX compartido.
# La DLQ se configura manualmente en RabbitMQTopologySetup con x-message-ttl
# y dead-letter de retorno al exchange original.
mp.messaging.incoming.email-notification-in.dead-letter-exchange=${RABBITMQ_DLX_EXCHANGE:DLX}
mp.messaging.incoming.email-notification-in.auto-bind-dlq=false

# RabbitMQ connection
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:guest}
rabbitmq-password=${RABBITMQ_PASS:guest}

# =============================================================================
# RABBITMQ — Retry y Dead Letter Queue (DLQ)
# =============================================================================
# Número máximo de reintentos antes de descartar el mensaje
email.notification.max-retries=${EMAIL_NOTIFICATION_MAX_RETRIES:3}
# Tiempo en milisegundos en la DLQ antes de reintentar
email.notification.dlq-ttl-ms=${EMAIL_NOTIFICATION_DLQ_TTL_MS:60000}
# Nombre del exchange dead-letter (compartido con otros servicios)
email.notification.dlx-exchange=${EMAIL_NOTIFICATION_DLX_EXCHANGE:DLX}
# Exchange y cola de parking para mensajes que exceden max-retries (revisión manual)
email.notification.parking-exchange=${EMAIL_NOTIFICATION_PARKING_EXCHANGE:email.notification.parking}
email.notification.parking-queue=${EMAIL_NOTIFICATION_PARKING_QUEUE:email.notification.queue.parking}

# =============================================================================
# RABBITMQ — Parking queue (Outgoing)
# =============================================================================
mp.messaging.outgoing.email-notification-parking.connector=smallrye-rabbitmq
mp.messaging.outgoing.email-notification-parking.exchange.name=${EMAIL_NOTIFICATION_PARKING_EXCHANGE:email.notification.parking}
mp.messaging.outgoing.email-notification-parking.exchange.type=direct
mp.messaging.outgoing.email-notification-parking.exchange.declare=true
mp.messaging.outgoing.email-notification-parking.default-routing-key=${RABBITMQ_ROUTING_KEY:email.notification}

# =============================================================================
# SMTP (Jakarta Mail)
# =============================================================================
custom.mail.host=${SMTP_HOST:smtp.gmail.com}
custom.mail.port=${SMTP_PORT:587}
custom.mail.username=${SMTP_USER:}
custom.mail.password=${SMTP_PASS:}
custom.mail.ssl=${SMTP_SSL:false}
custom.mail.start-tls=${SMTP_START_TLS:required}
custom.mail.mock=${SMTP_MOCK:false}

# =============================================================================
# Email Sender
# =============================================================================
email.sender.address=${EMAIL_SENDER:noreply@astc.com}
email.sender.name=${EMAIL_SENDER_NAME:ASTC - Sistema de Asistencia}

# =============================================================================
# VERTX (EVENT LOOP)
# =============================================================================
quarkus.vertx.max-event-loop-execute-time=60s

# =============================================================================
# LOGGING
# =============================================================================
quarkus.log.level=${LOG_LEVEL:INFO}

# =============================================================================
# SECURITY
# =============================================================================
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit

# =============================================================================
# CORS
# =============================================================================
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true

# =============================================================================
# ANTI-SPAM — Cooldown para notificaciones duplicadas
# Si el mismo usuario ya recibi\u00f3 la misma notificaci\u00f3n hace menos de N segundos,
# se omite (email + in-app + push). 0 desactiva el control.
# =============================================================================
app.notification.cooldown-seconds=${NOTIFICATION_COOLDOWN_SECONDS:300}

# =============================================================================
# HEALTH
# =============================================================================
# Health check root path
quarkus.smallrye-health.root-path=/q/health

# Configuración opcional para Firebase
push.google.service-account=
quarkus.log.category."io.smallrye.health".level=WARN
